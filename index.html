<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的 Galgame</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #111;
        }

        /* 图片 */
        #sceneImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* 文字区域 */
        #textBox {
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 8%;
            padding: 25px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 15px;
            font-size: 20px;
            line-height: 1.7;
            display: none;
        }

        /* 选择区域 */
        #choices {
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: 8%;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .choice {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .choice:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 开始提示 */
        #startText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
    </style>
</head>

<body>

<div id="game">

    <img id="sceneImage">

    <div id="textBox"></div>

    <div id="choices"></div>

    <div id="startText">
        点击屏幕开始
    </div>

</div>


<script>

    /*
    ==========================================
    剧情数据
    ==========================================
    
    以后你主要修改这里。

    image = 图片
    text  = 文字
    choices = 选项

    next = 下一段剧情的名字
    */

    const story = {

        start: {
            image: "images/start.jpg",

            text: "这是故事的开始。\n你站在一条陌生的街道上。",

            choices: [
                {
                    label: "A. 向前走",
                    next: "road"
                },
                {
                    label: "B. 留在原地",
                    next: "stay"
                }
            ]
        },


        road: {
            image: "images/road.jpg",

            text: "你选择向前走去。\n远处似乎有一个人影。",

            choices: [
                {
                    label: "A. 走过去看看",
                    next: "meet"
                },
                {
                    label: "B. 转身离开",
                    next: "leave"
                }
            ]
        },


        stay: {
            image: "images/stay.jpg",

            text: "你没有行动。\n可是，那个人影却慢慢向你走来。",

            choices: [
                {
                    label: "A. 等待",
                    next: "meet"
                },
                {
                    label: "B. 离开这里",
                    next: "leave"
                }
            ]
        },


        meet: {
            image: "images/meet.jpg",

            text: "她停在了你的面前。\n然后，对你笑了一下。",

            choices: [
                {
                    label: "A. 和她说话",
                    next: "talk"
                },
                {
                    label: "B. 什么也不说",
                    next: "silent"
                }
            ]
        },


        talk: {
            image: "images/talk.jpg",

            text: "「你终于来了。」",

            choices: [
                {
                    label: "A. 「你认识我？」",
                    next: "end"
                },
                {
                    label: "B. 「你是谁？」",
                    next: "end"
                }
            ]
        },


        silent: {
            image: "images/silent.jpg",

            text: "你没有说话。\n她也没有催促你。",

            choices: [
                {
                    label: "A. 抬起头",
                    next: "end"
                }
            ]
        },


        leave: {
            image: "images/leave.jpg",

            text: "你选择离开。\n但不知道为什么，你总觉得自己错过了什么。",

            choices: [
                {
                    label: "重新开始",
                    next: "start"
                }
            ]
        },


        end: {
            image: "images/end.jpg",

            text: "故事暂时到这里。\n以后，这里会变成真正的故事。",

            choices: [
                {
                    label: "重新开始",
                    next: "start"
                }
            ]
        }

    };


    /*
    ==========================================
    游戏程序
    ==========================================
    */

    const image = document.getElementById("sceneImage");
    const textBox = document.getElementById("textBox");
    const choices = document.getElementById("choices");
    const startText = document.getElementById("startText");

    let currentScene = "start";

    // 当前阶段
    // 0 = 等待开始
    // 1 = 图片
    // 2 = 文字
    // 3 = 选择

    let stage = 0;


    function showScene(sceneName) {

        currentScene = sceneName;

        const scene = story[sceneName];

        if (!scene) {
            return;
        }

        image.src = scene.image;

        textBox.innerText = scene.text;

        choices.innerHTML = "";

        scene.choices.forEach((choice) => {

            const button = document.createElement("button");

            button.className = "choice";

            button.innerText = choice.label;

            button.onclick = function(event) {

                event.stopPropagation();

                showScene(choice.next);

            };

            choices.appendChild(button);

        });

        stage = 1;

        startText.style.display = "none";

        image.style.display = "block";

        textBox.style.display = "none";

        choices.style.display = "none";
    }


    /*
    点击屏幕推进剧情
    */

    document.getElementById("game").addEventListener("click", function() {

        if (stage === 0) {

            showScene(currentScene);

        }

        else if (stage === 1) {

            // 图片 → 文字

            textBox.style.display = "block";

            stage = 2;

        }

        else if (stage === 2) {

            // 文字 → 选择

            choices.style.display = "flex";

            stage = 3;

        }

    });


    /*
    开始游戏
    */

    startText.onclick = function(event) {

        event.stopPropagation();

        showScene("start");

    };

</script>

</body>
</html>
